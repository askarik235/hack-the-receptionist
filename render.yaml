# Render Blueprint for the hosted judge demo: one web service, Express serves the built game.
# Render > New > Blueprint > pick this repo. Secrets are entered in the Render dashboard
# (sync: false), never stored here.
services:
  - type: web
    name: hack-the-receptionist
    runtime: node
    # Free plan: no cost, but the service sleeps after 15 idle minutes (the next visit waits
    # about a minute while it wakes) and has no disk, so the database starts empty after every
    # restart, sleep or deploy. For progress that lasts, switch to `plan: starter` and add:
    #   disk: { name: game-data, mountPath: /var/data, sizeGB: 1 }
    # plus the env var DB_PATH=/var/data/game.db.
    plan: free
    region: frankfurt
    # devDependencies (Vite) are needed to build the frontend.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -w backend
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # The judges' access code. Share it only in the submission's testing notes.
      - key: ACCESS_CODE
        sync: false
      - key: NAPSTER_API_KEY
        sync: false
      # This service's own https://....onrender.com address, no trailing slash.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: NAPSTER_WEBHOOK_SECRET
        sync: false
      # Must be the same value `npm run setup` used: setup gives it to Napster, which sends it
      # back on every tool call.
      - key: TOOL_SECRET
        sync: false
      # Server-only secrets, so Render can generate them.
      - key: CODE_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
